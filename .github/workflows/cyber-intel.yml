name: Sync official cyber intelligence
on:
  schedule:
    - cron: "17 2,8,14,20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/sync_cyber_intel.py"
      - "scripts/sync_ai_news.py"
      - "scripts/translate_ai_news.py"
      - "scripts/translate_cyber_intel.py"
      - "tests/test_cyber_intel.py"
      - "tests/test_ai_news.py"
      - "tests/test_cyber_translation.py"
      - ".github/workflows/cyber-intel.yml"

permissions:
  contents: write

concurrency:
  group: os1n7-cyber-intel
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test feeds and Ukrainian translation logic
        run: python -m unittest discover -s tests -p "test_cyber*.py" -v
      - name: Test original-source AI news feed parsing
        run: python -m unittest discover -s tests -p "test_ai_news.py" -v
      - name: Install offline English-to-Ukrainian translator
        run: python -m pip install "argostranslate>=1.10,<2"
      - name: Fetch official cybersecurity sources
        run: python scripts/sync_cyber_intel.py
      - name: Fetch original AI-news feeds
        run: python scripts/sync_ai_news.py
      - name: Translate headlines and summaries into Ukrainian
        timeout-minutes: 15
        run: |
          python scripts/translate_cyber_intel.py
          python scripts/translate_ai_news.py
      - name: Publish official news without overwriting concurrent commits
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Always recompute against the latest main. A parallel edit to the
          # published snapshot must never cause an unresolved rebase conflict.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/sync_cyber_intel.py
            python scripts/sync_ai_news.py
            python scripts/translate_cyber_intel.py
            python scripts/translate_ai_news.py
            git add content/cyber-intel.json content/ai-news.json
            if git diff --cached --quiet; then
              echo "Official cyber data unchanged"
              exit 0
            fi
            git commit -m "data: refresh official cyber intelligence and yearly statistics"
            if git push origin HEAD:main; then
              echo "Cyber intelligence updated successfully"
              exit 0
            fi
            echo "Concurrent update detected, retrying on latest main: $attempt/3"
            sleep "$(( attempt * 2 ))"
          done
          echo "::error::Unable to publish news due to concurrent updates"
          exit 1
