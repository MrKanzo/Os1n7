name: Sync official cyber intelligence
on:
  schedule:
    - cron: "17 2,8,14,20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/sync_cyber_intel.py"
      - "scripts/translate_cyber_intel.py"
      - "tests/test_cyber_intel.py"
      - "tests/test_cyber_translation.py"
      - ".github/workflows/cyber-intel.yml"

permissions:
  contents: write

concurrency:
  group: os1n7-cyber-intel
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test feeds and Ukrainian translation logic
        run: python -m unittest discover -s tests -p "test_cyber*.py" -v
      - name: Install offline English-to-Ukrainian translator
        run: python -m pip install "argostranslate>=1.10,<2"
      - name: Fetch official cybersecurity sources
        run: python scripts/sync_cyber_intel.py
      - name: Translate headlines and summaries into Ukrainian
        timeout-minutes: 15
        run: python scripts/translate_cyber_intel.py
      - name: Update hosted JSON snapshot, if changed
        run: |
          if git diff --quiet -- content/cyber-intel.json; then
            echo "No changed cyber-intelligence data"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/cyber-intel.json
          git commit -m "data: refresh official cyber intelligence and yearly statistics"
          git pull --rebase origin main
          git push origin HEAD:main
