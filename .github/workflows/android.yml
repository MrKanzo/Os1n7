name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Os1n7-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish GitHub Release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="v$VERSION"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "OS1N7 $TAG" --notes "OS1N7 Android APK. Debug build; installation over older debug APK may require reinstalling due to different signing keys." --target "$GITHUB_SHA"
          fi
